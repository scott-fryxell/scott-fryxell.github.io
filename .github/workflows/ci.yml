name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Downloads the static example into .cache/static, then builds
      - run: npm run build

      # No deploy: Brayness publishes gh-pages from the vault with
      # `apps publish blog --github scott-fryxell/scott-fryxell.github.io`.
