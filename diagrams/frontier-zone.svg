    .e0 { stop-color: #d0342c; stop-opacity: 0; }
    .e1 { stop-color: #d0342c; stop-opacity: 1; }
    .floor { stroke: #6b7480; stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
    .lead { stroke: #d0342c; stroke-width: 1.5; fill: none; }
    .fable { fill: #d0342c; font: 700 17px system-ui, sans-serif; letter-spacing: .1em; }
    .money { fill: #d0342c; font: 700 30px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
    .gate { stroke: #1b1f24; stroke-width: 2; fill: none; }
    .gate-num { fill: #1b1f24; font: 600 12px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .gate-text { fill: #1b1f24; font: 600 12px system-ui, sans-serif; letter-spacing: .03em; }
    .label { fill: #1b1f24; font: 600 14px system-ui, sans-serif; }
    .meta { fill: #6b7480; font: 400 13px system-ui, sans-serif; }
    .cap { fill: #1b1f24; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .capsub { fill: #6b7480; font: 400 14px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: #6b7480; font: 400 13px system-ui, sans-serif; }
    .s1 { stop-color: #d0342c; stop-opacity: .55; }
    .s2 { stop-color: #c9cfd6; stop-opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .seg { fill: #4a525c; }
      .role { fill: #dfe4ea; }
      .e0 { stop-color: #e2554c; stop-opacity: 0; }
      .e1 { stop-color: #e2554c; stop-opacity: 1; }
      .money, .fable { fill: #f0776e; }
      .gate { stroke: #e6eaee; }
      .gate-num, .gate-text, .label, .cap { fill: #e6eaee; }
      .meta, .capsub, .edge { fill: #9aa4b0; }
      .floor { stroke: #6b7480; }
      .s1 { stop-color: #e2554c; stop-opacity: .5; }
      .s2 { stop-color: #4a525c; stop-opacity: .6; }
      .s3 { stop-color: #e2554c; stop-opacity: .32; }
      .commodity { fill: #8fa3b8; opacity: .45; }
    }
  </style>

