<svg xmlns="http://www.w3.org/2000/svg" viewBox="59.9 -164 664.1 285.3" width="664.1" height="285.3" role="img" aria-labelledby="gtitle gdesc">
  <title id="gtitle">Where fable enters the five stops</title>
  <desc id="gdesc">A gauge of five stops - explore, planner, worker, critic, promoter - with a bell curve riding over it. The curve is low through explore, where the talk is loose and nothing is committed, rises at the tail of explore, peaks across planner where the shape has to be right, and is back on the commodity floor a slice into worker, staying there through critic and promoter.</desc>
