<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="bt bd">
  <title id="bt">Start once, freeze, hand out copies</title>
  <desc id="bd">Three beats left to right. First, start it once - install and set up. Then freeze, drawn in red: a snapshot. From the freeze, three wires fan out to three copies, one per person, made in a moment.</desc>
  <style>
    :root { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .box { fill: #c9cfd6; }
    .subject { fill: #d0342c; fill-opacity: .18; stroke: #d0342c; stroke-width: 2; }
    .name { fill: #1b1f24; font: 600 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .subject-name { fill: #d0342c; font: 700 19px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
    .meta { fill: #6b7480; font: 400 13px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .wire { fill: none; stroke: #6b7480; stroke-width: 1.5; }
    .tip { fill: #6b7480; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #4a525c; }
      .name { fill: #e6eaee; }
      .meta { fill: #9aa4b0; }
      .wire { stroke: #9aa4b0; }
      .tip { fill: #9aa4b0; }
      .subject { fill: #e2554c; fill-opacity: .22; stroke: #e2554c; }
      .subject-name { fill: #f0776e; }
    }
  </style>

  <path class="wire" d="M174 130H216"/>
  <path class="tip" d="M216 124l14 6-14 6z"/>
  <path class="wire" d="M380 130C420 130 430 60 456 60"/>
  <path class="wire" d="M380 130H456"/>
  <path class="wire" d="M380 130C420 130 430 200 456 200"/>
  <path class="tip" d="M456 54l14 6-14 6z"/>
  <path class="tip" d="M456 124l14 6-14 6z"/>
  <path class="tip" d="M456 194l14 6-14 6z"/>

  <rect class="box" x="24" y="100" width="150" height="60" rx="6"/>
  <text class="name" x="99" y="126">start it once</text>
  <text class="meta" x="99" y="146">install, set up</text>

  <rect class="subject" x="230" y="100" width="150" height="60" rx="6"/>
  <text class="subject-name" x="305" y="126">freeze</text>
  <text class="meta" x="305" y="146">a snapshot</text>

  <rect class="box" x="470" y="38" width="190" height="44" rx="6"/>
  <text class="name" x="565" y="60">a copy</text>
  <rect class="box" x="470" y="108" width="190" height="44" rx="6"/>
  <text class="name" x="565" y="130">a copy</text>
  <rect class="box" x="470" y="178" width="190" height="44" rx="6"/>
  <text class="name" x="565" y="200">a copy</text>
</svg>
